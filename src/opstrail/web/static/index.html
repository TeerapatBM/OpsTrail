<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpsTrail</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip-link" href="#view">ข้ามไปเนื้อหา</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M10 8v8l12 8M10 16h12"/><circle cx="10" cy="8" r="3"/><circle cx="22" cy="16" r="3"/><circle cx="22" cy="24" r="3"/></svg>
        <span>OpsTrail<small>บันทึกงาน สู่เอกสาร</small></span>
      </a>
      <nav id="nav" aria-label="เมนูหลัก">
        <a href="#/" data-route="day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M7 6h13M7 12h9M7 18h13"/><circle cx="7" cy="6" r="2"/><circle cx="7" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg><span>วันนี้ / งาน</span></a>
        <a href="#/worklogs" data-route="worklogs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-12 4h3m2 0h3m-8 3h3"/></svg><span>Daily worklog</span></a>
        <a href="#/docs" data-route="docs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zm0 0v5h5M8 12h8m-8 4h6"/></svg><span>เอกสาร</span></a>
        <a href="#/search" data-route="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span>ค้นหา</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span>ตั้งค่า</span></a>
      </nav>
      <div class="side-status">
        <label class="field theme-field">ธีม
          <select id="theme-sidebar" data-theme-select>
            <option value="auto">อัตโนมัติ</option><option value="light">สว่าง</option><option value="dark">มืด</option>
          </select>
        </label>
        <div id="agent-status" class="muted small">กำลังตรวจสอบ…</div>
        <button id="capture-toggle" class="btn small" type="button">…</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" aria-label="หน้าต่างดำเนินการ"><form method="dialog" id="modal-form"></form></dialog>
  <script src="/static/app.js"></script>
</body>
</html>
