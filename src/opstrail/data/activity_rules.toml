# OpsTrail activity rules — first matching rule wins.
# Override or extend in ~/.opstrail/activity_rules.toml (your rules are checked BEFORE these).
#
# Fields (all optional except activity):
#   activity      meeting | chat | email | terminal | remote | console | research | docs | code | ai | files | other
#   types         event types the rule applies to (default: ["window", "screenshot"])
#   apps          process names (case-insensitive), e.g. ["ms-teams.exe"]; "@browser" = any web browser
#   title_regex   regex the window title must match (named group (?P<subject>...) becomes the subject)
#   title_exclude regex that must NOT match
#   cmd_regex     regex for shell/ai commands
#   subject       fixed subject when the regex has no (?P<subject>) group (e.g. a product name)

# ---------------------------------------------------------------- meetings
[[rule]]
activity = "meeting"
apps = ["ms-teams.exe", "teams.exe", "@browser"]
title_regex = '^(?:Meeting compact view \| )?(?P<subject>[^|]+?) \| Microsoft Teams$'
title_exclude = '(?i)^(chat|activity|calendar|teams|calls|files|onedrive|apps|copilot|settings|community|assignments|planner|approvals|search|notifications|meet|people|home|new chat|microsoft teams)\s*(\||$)'

[[rule]]
activity = "meeting"
apps = ["ms-teams.exe", "teams.exe"]
title_regex = '(?i)^(?P<subject>(?:meeting|call|การประชุม|โทร)[^|]*?) \|'

[[rule]]
activity = "meeting"
apps = ["zoom.exe"]
title_regex = '(?i)(?P<subject>zoom (?:meeting|webinar)[^|]*)'

[[rule]]
activity = "meeting"
apps = ["@browser"]
title_regex = '(?i)^(?:meet - )?(?P<subject>.+?) - google meet'

[[rule]]
activity = "meeting"
apps = ["webexmta.exe", "ciscocollabhost.exe", "atmgr.exe"]
subject = "Webex"

# -------------------------------------------------------------------- chat
[[rule]]
activity = "chat"
apps = ["ms-teams.exe", "teams.exe", "@browser"]
title_regex = '^Chat \| (?P<subject>[^|]+?) \| Microsoft Teams'

[[rule]]
activity = "chat"
apps = ["ms-teams.exe", "teams.exe"]
subject = "Microsoft Teams"

[[rule]]
activity = "chat"
apps = ["slack.exe", "discord.exe"]

# ------------------------------------------------------------------- email
[[rule]]
activity = "email"
apps = ["outlook.exe", "olk.exe", "thunderbird.exe"]
title_regex = '^(?P<subject>.+?) - (?:.+ - )?Outlook$'

[[rule]]
activity = "email"
apps = ["outlook.exe", "olk.exe", "thunderbird.exe"]
subject = "Outlook"

[[rule]]
activity = "email"
apps = ["@browser"]
title_regex = '(?i)(?:outlook|gmail)\b'
title_exclude = '(?i)microsoft teams'

