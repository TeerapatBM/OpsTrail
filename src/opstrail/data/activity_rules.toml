# -------------------------------------------------------------- research
[[rule]]
activity = "research"
apps = ["@browser"]
title_regex = '(?i)documentation|\bdocs\b|microsoft learn|stack ?overflow|github|reddit|google search| - search|knowledge ?base|community|forum|wiki'

# ---------------------------------------------------------------- remote
[[rule]]
activity = "remote"
apps = ["mstsc.exe", "putty.exe", "mobaxterm.exe", "vmconnect.exe", "vmrc.exe", "rdcman.exe", "remotedesktopmanager.exe", "anydesk.exe", "teamviewer.exe", "securecrt.exe", "termius.exe"]
title_regex = '(?P<subject>[\w.-]+\.[\w.-]+|\d{1,3}(?:\.\d{1,3}){3})'

[[rule]]
activity = "remote"
apps = ["mstsc.exe", "putty.exe", "mobaxterm.exe", "vmconnect.exe", "vmrc.exe", "rdcman.exe", "remotedesktopmanager.exe", "anydesk.exe", "teamviewer.exe", "securecrt.exe", "termius.exe"]

[[rule]]
activity = "remote"
types = ["shell", "ai"]
cmd_regex = '(?i)^\s*(?:ssh|mstsc|Enter-PSSession|winrs|telnet)\b.*?(?:@|\s)(?P<subject>[\w.-]+\.[\w.-]+|\d{1,3}(?:\.\d{1,3}){3}|[\w-]{3,})\s*$'

# ---------------------------------------------------------------- terminal
[[rule]]
activity = "terminal"
apps = ["windowsterminal.exe", "pwsh.exe", "powershell.exe", "powershell_ise.exe", "cmd.exe", "conhost.exe", "wsl.exe", "ubuntu.exe", "alacritty.exe", "wezterm-gui.exe"]

[[rule]]
activity = "terminal"
types = ["shell"]

[[rule]]
activity = "ai"
types = ["ai"]

# ------------------------------------------------------------------- files
[[rule]]
activity = "files"
