[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opstrail"
version = "0.3.1"
description = "OpsTrail – capture daily ops work and turn it into SOPs, delivery docs and guides via MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Sysware" }]
dependencies = [
  "mcp>=1.20",
  "python-docx>=1.1",
  "tomli>=2.0; python_version < '3.11'",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
agent = [
  "pynput>=1.7; sys_platform != 'win32'",  # Windows uses RegisterHotKey (no keyboard hook)
  "mss>=9.0",
  "psutil>=5.9",
  "pystray>=0.19",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",  # starlette TestClient
]

[project.scripts]
opstrail = "opstrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opstrail = ["web/static/*", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
