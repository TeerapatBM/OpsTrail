# Claude reviews PRs that were NOT made by scripts/duo.ps1 (duo already had them cross-reviewed locally)
# and answers "@claude" mentions. Uses your Claude Pro/Max SUBSCRIPTION, not API credit:
#   1. on your laptop:  claude setup-token      (prints a long-lived OAuth token)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret CLAUDE_CODE_OAUTH_TOKEN
# Without the secret this workflow does nothing (it is skipped, not failed).
# Options: https://github.com/anthropics/claude-code-action
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'duo')) ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the reviewer for OpsTrail. Read AGENTS.md, SPEC.md and docs/HANDOFF.md first.
            Review the changes of this pull request against those rules: business logic in service.py,
            redaction of every captured string, Windows-first (ctypes, ASCII-only .ps1), mcp SDK 1.x/2.x
            compatibility, the web UI LocalOnly security middleware, tests for every behaviour change, and
            SPEC.md/HANDOFF.md kept current. Point out concrete bugs with file:line and a suggested fix.
            Be concise; approve-style summary at the end (LGTM / changes needed).
