name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[agent,dev]"
      - name: Tests (Windows-only tests run on the Windows runner)
        run: python -m pytest -q
      - name: Golden-day eval (deterministic)
        env:
          OPSTRAIL_HOME: ${{ runner.temp }}/opstrail-eval
        run: python -m opstrail eval

  powershell:
    name: PowerShell 5.1 checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with Windows PowerShell 5.1 and require ASCII
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path scripts, hooks -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$($f.Name): $_" }; $bad++ }
            $text = [IO.File]::ReadAllText($f.FullName)
            if ($text -match '[^\x00-\x7F]') { Write-Host "$($f.Name): contains non-ASCII characters"; $bad++ }
          }
          if ($bad) { exit 1 }
